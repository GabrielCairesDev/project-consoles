[workspace]
resolver = "3"
members = ["src-tauri", "crates/chips", "crates/sms", "crates/genesis", "crates/gameboy", "crates/player"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Gabriel Caires"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# O núcleo roda a cada ciclo de CPU: em debug ficaria lento demais para jogar.
[profile.dev.package.sms]
opt-level = 3

[profile.dev.package.chips]
opt-level = 3

[profile.dev.package.genesis]
opt-level = 3

[profile.dev.package.gameboy]
opt-level = 3
